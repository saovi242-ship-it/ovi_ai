name: ovi_ai
description: A production-ready foundation for the OVI AI companion app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Application foundation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Networking and serialization
  dio: ^5.8.0+1
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  # Local persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  drift: ^2.27.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.29
  path: ^1.9.0
  path_provider: ^2.1.5

  # Motion and interactive media
  lottie: ^3.3.1
  rive: ^0.13.20

  # Localization and responsive layout
  easy_localization: ^3.0.7
  intl: ^0.20.2
  responsive_framework: ^1.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.15
  freezed: ^2.5.7

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/images/
    - assets/icons/
    - assets/translations/
    - assets/rive/